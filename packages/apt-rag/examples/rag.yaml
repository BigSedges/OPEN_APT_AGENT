# Example apt_rag config. Replace the placeholder root and asset paths with
# your own local deployment. Assets are external; the wheel does not bundle them.
project_root: /path/to/your/apt_rag_assets

paths:
  corpus: corpus/chunks.jsonl
  index_pointer: indexes/bge-current.json
  bm25_pointer: indexes/bm25-current.json
  metadata: metadata/chunks.meta.jsonl
  model: models/bge-m3
  sources_manifest: metadata/sources.json

retrieval:
  mode: dense
  top_k: 5
  max_top_k: 20
  dense_candidates: 50
  bm25_candidates: 50
  max_context_chars: 6000
  max_chunks_per_document: 2
  bm25:
    k1: 1.5
    b: 0.75
  fusion:
    method: weighted_rrf
    rrf_k: 60
    weights:
      dense: 0.7
      bm25: 0.3
  rerank:
    enabled: false
    model: null

model:
  device: cuda
  offline: true
  max_seq_length: 1024
