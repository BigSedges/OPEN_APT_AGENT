[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-rag"
version = "0.1.0"
description = "Local APT RAG knowledge retrieval facade"
readme = "apt_rag/README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "PyYAML",
]

[project.optional-dependencies]
dense = ["sentence-transformers", "torch"]

[project.scripts]
apt-rag = "apt_rag.cli:main"

[tool.setuptools]
packages = ["apt_rag", "rag"]
