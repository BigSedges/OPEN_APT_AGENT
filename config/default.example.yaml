# Default portable configuration template for OPEN_APT_AGENT.
# Copy to config/local.yaml (or pass via APT_AGENT_CONFIG) and customize local paths/credentials.

minimum_seed_level: medium

engines:
  zircolite:
    enabled: true
    bin_path: null
    rules_dir: null
    config_path: "script/log_convert/configs/zircolite_config.yaml"
    mapping_path: null
    working_dir: null
    timeout_s: 120.0
  hayabusa:
    enabled: true
    bin_path: null
    rules_dir: null
    config_path: null
    mapping_path: null
    working_dir: null
    timeout_s: 120.0
  takajo:
    enabled: true
    bin_path: null
    rules_dir: null
    config_path: null
    mapping_path: null
    working_dir: null
    timeout_s: 120.0
  chainsaw:
    enabled: true
    bin_path: null
    rules_dir: null
    config_path: "script/log_convert/configs/chainsaw_custom_mapping.yml"
    mapping_path: null
    working_dir: null
    timeout_s: 120.0
  rsigma:
    enabled: true
    bin_path: null
    rules_dir: null
    config_path: "script/log_convert/configs/rsigma_pipeline.yml"
    mapping_path: null
    working_dir: null
    timeout_s: 120.0
  pysigma:
    enabled: true
    bin_path: null
    rules_dir: null
    config_path: null
    mapping_path: null
    working_dir: null
    timeout_s: 120.0

rag:
  knowledge_path: "packages/apt-rag/public_kb/chunks.jsonl.gz"
  config_path: null
  mode: "bm25"
  top_k: 5
  timeout_ms: 60000
  offline: true

llm:
  enabled: false
  provider: "openai_compatible"
  base_url: null
  api_key: null
  model: "gpt-4o-mini"
  temperature: 0.0
  max_tokens: 4096
  timeout_s: 60.0

budget:
  max_tasks_per_round: 3
  max_rounds: 5
  max_steps_per_task: 8
  max_challenger_rounds: 1
  max_repair_rounds: 1
  wall_clock_s: 300.0
  max_tokens: 120000
  reserve_ratio: 0.8

snapshots:
  root_dir: ".apt_agent/snapshots"
  mapping_version: "v1"
  ruleset_version: "v1"
  knowledge_snapshot_id: "public_kb"
