# Valid Zircolite mapping draft adding creator_pid -> ParentProcessId while preserving core traceability fields
exclusions: []
useless: []

mappings:
  "@timestamp": "SystemTime"
  "Provider_Name": "Provider_Name"
  "EventID": "EventID"
  "Channel": "Channel"
  "Computer": "Computer"
  "EventRecordID": "EventRecordID"
  "event_id": "event_id"
  "raw_id": "raw_id"
  "source_file": "source_file"
  "record_index": "record_index"
  "creator_pid": "ParentProcessId"

alias:
  src_ip: "SourceIp"
  dst_ip: "DestinationIp"
  src_port: "SourcePort"
  dst_port: "DestinationPort"

split: {}
transforms_enabled: false
